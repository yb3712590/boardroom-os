<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Library</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:2rem;line-height:1.45;color:#1f2937;background:#f9fafb}
    main{max-width:52rem;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:.75rem;padding:1.5rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
    h1{margin-top:0}
    button{cursor:pointer;border:1px solid #9ca3af;border-radius:.375rem;background:#fff;padding:.35rem .6rem}
    button:hover{background:#f3f4f6}
    ul{list-style:none;padding:0;margin:1rem 0 0}
    li{display:flex;gap:.75rem;align-items:center;justify-content:space-between;border-top:1px solid #e5e7eb;padding:.75rem 0}
    .muted{color:#6b7280}
    .error{color:#b91c1c}
  </style>
</head>
<body>
  <main>
    <h1>Tiny Library</h1>
    <p class="muted">Books are loaded from the backend <code>/books</code> API.</p>
    <button id="refresh-books" type="button">Refresh books</button>
    <p id="book-status" class="muted" role="status">Ready.</p>
    <ul id="book-list" aria-label="Books"></ul>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
